<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FretTrainer">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>FretTrainer</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</head>
<body>
  <main id="menu" class="screen">
    <header class="menu-head">
      <h1>FretTrainer</h1>
      <p>Lär dig greppbrädan – korta övningar för mobilen.</p>
    </header>
    <div id="exercise-list"></div>
    <p class="tip">Tips: slå på ljudet (på iPhone även ringsignalsreglaget) och vrid gärna telefonen till liggande läge.</p>
  </main>

  <main id="play" class="screen" hidden>
    <div class="topbar">
      <button id="quit" class="ghost" aria-label="Avsluta">✕</button>
      <div id="play-title"></div>
      <div id="timer">0:00</div>
    </div>
    <div id="hud"></div>
    <div id="board"></div>
    <div id="feedback" role="status"></div>
  </main>

  <main id="result" class="screen" hidden>
    <h2 id="result-title"></h2>
    <p id="result-note"></p>
    <div id="result-stats"></div>
    <div class="result-actions">
      <button id="again" class="primary">Kör igen</button>
      <button id="to-menu" class="ghost">Meny</button>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
